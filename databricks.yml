# Declarative Automation Bundle (formerly Asset Bundle): Sanad's Databricks resources as code.
# The workspace host comes from your CLI profile (~/.databrickscfg), never from this file.
# Deploy: databricks bundle deploy --profile sanad
# Run:    databricks bundle run sanad_medallion --profile sanad

bundle:
  name: sanad

variables:
  warehouse_id:
    description: SQL warehouse that runs the dashboard's and the Genie agent's queries
    lookup:
      warehouse: Serverless Starter Warehouse # found by name at deploy time, so no ID in git

resources:
  dashboards:
    sanad_gold:
      display_name: Najm operations (gold)
      file_path: dashboards/sanad_gold.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: sanad # dataset queries use bare names (FROM invoice_issues);
      dataset_schema: gold   # these two fill in the catalog and schema

  genie_spaces:
    sanad_ops_analytics: # the Ops Analytics specialist (Phase 4); queries run as the asking user
      title: Sanad Ops Analytics
      description: "Delivery questions for Najm ops managers: late deliveries by region, carrier and month."
      file_path: genie/ops_analytics.geniespace.json
      warehouse_id: ${var.warehouse_id}
      permissions:
        - level: CAN_RUN
          group_name: ops_managers

  pipelines:
    sanad_medallion:
      name: sanad_medallion
      catalog: sanad
      schema: bronze # default schema; silver and gold tables name their own schema
      serverless: true # Free Edition only has serverless compute
      continuous: false # run when triggered, not 24/7
      libraries:
        - glob:
            include: pipelines/transformations/**

  jobs:
    # The "doorbell": when the source systems drop new files, run the pipeline.
    # The generator stands in for those outside systems, so it is not part of the job.
    sanad_ingest:
      name: sanad_ingest
      tags:
        project: sanad
      performance_target: STANDARD # no deadline: a few minutes of start-up is fine, and cheaper
      trigger:
        pause_status: UNPAUSED # development mode pauses triggers unless the job says otherwise
        file_arrival:
          url: /Volumes/sanad/bronze/landing/ # checks every subfolder, about once a minute
          # Both are as fast as the API allows (minimum 60). 60s of quiet also covers an
          # ERP export whose files land about 20s apart, so it becomes one run, not three.
          wait_after_last_change_seconds: 60 # folder must be quiet this long before a run starts
          min_time_between_triggers_seconds: 60 # cooldown between two runs
      tasks:
        - task_key: refresh_medallion
          pipeline_task:
            pipeline_id: ${resources.pipelines.sanad_medallion.id}

  # AI Search (formerly Vector Search): the policy and KB index the agents retrieve from.
  # Free Edition allows one endpoint. STANDARD filters before it searches, so a filtered
  # query still returns k results; storage-optimized filters after, and can return fewer.
  vector_search_endpoints:
    sanad_search:
      name: sanad-search
      endpoint_type: STANDARD

  vector_search_indexes:
    chunks_index:
      name: sanad.ai.chunks_index
      endpoint_name: ${resources.vector_search_endpoints.sanad_search.name}
      primary_key: chunk_id
      index_type: DELTA_SYNC
      delta_sync_index_spec:
        source_table: sanad.ai.chunks # needs its change data feed on (retrieval/chunks.sql)
        pipeline_type: TRIGGERED # sync when told to, after chunks.sql runs; not 24/7
        embedding_source_columns:
          - name: chunk_to_embed # Databricks embeds this column for us (managed embeddings)
            embedding_model_endpoint_name: databricks-gte-large-en # 8192-token window fits a whole doc

targets:
  dev:
    mode: development # names the pipeline "[dev <you>] ..." and keeps it separate from prod
    default: true
