[project]
name = "sanad"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "databricks-sdk>=0.162.0",
]

[dependency-groups]
dev = [
    "fastapi==0.162.2",
    "httpx==0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]  # agent/ has its own env and tests: cd agent && uv run pytest

[tool.ruff]
line-length = 100
# Agent Bricks server wiring, owned by agent/AGENTKIT_CONTRACT.md: keep it identical to the template.
extend-exclude = ["agent/runtime"]

[tool.ruff.lint.per-file-ignores]
# Databricks injects the `spark` session into pipeline files at run time.
"pipelines/transformations/*" = ["F821"]
